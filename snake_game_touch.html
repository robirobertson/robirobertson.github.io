<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Spiel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            /* Verhindert Zoom und Scroll auf mobilen Geräten */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 90vw;
            max-height: 90vh;
            overflow: hidden;
        }
        
        .game-header {
            color: white;
            margin-bottom: 15px;
        }
        
        .game-header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .score {
            font-size: 1.5em;
            margin: 10px 0;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        canvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            /* Touch-Events für Canvas aktivieren */
            touch-action: none;
            max-width: 100%;
            max-height: 60vh;
        }
        
        .controls {
            margin-top: 15px;
            color: white;
            font-size: 1em;
            line-height: 1.4;
        }
        
        .mobile-controls {
            display: none;
            margin-top: 15px;
        }
        
        .touch-instructions {
            color: white;
            font-size: 1.1em;
            margin: 10px 0;
            display: none;
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ff6b6b;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border: 3px solid #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            z-index: 1000;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);
        }

        .quiz-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .quiz-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            margin: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .quiz-content h3 {
            color: white;
            margin: 0 0 20px 0;
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .quiz-content p {
            color: white;
            font-size: 1.2em;
            margin: 20px 0;
            line-height: 1.5;
        }

        .quiz-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .quiz-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 120px;
        }

        .quiz-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .quiz-btn.correct {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .quiz-btn.wrong {
            background: #f44336;
            border-color: #f44336;
        }

        .paused-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            display: none;
        }

        /* Mobile-spezifische Styles */
        @media (max-width: 768px) {
            .game-container {
                padding: 15px;
            }
            
            .game-header h1 {
                font-size: 2em;
            }
            
            .score {
                font-size: 1.2em;
            }
            
            .controls {
                font-size: 0.9em;
            }
            
            .touch-instructions {
                display: block;
            }
            
            .quiz-content {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .quiz-content h3 {
                font-size: 1.5em;
            }
            
            .quiz-content p {
                font-size: 1em;
            }
            
            .quiz-buttons {
                flex-direction: column;
                gap: 15px;
            }
            
            .quiz-btn {
                width: 100%;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🐍 Snake</h1>
            <div class="score">Punkte: <span id="score">0</span></div>
            <div class="score">Highscore: <span id="highscore">0</span></div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="pausedIndicator" class="paused-indicator">⏸️ QUIZ PAUSE</div>
        </div>
        
        <div class="controls">
            <div class="touch-instructions">📱 Wische zum Steuern!</div>
            <div>🎮 Steuerung mit Pfeiltasten oder Wischen</div>
            <div>Leertaste oder Tap = Pause</div>
            <div>🚀 Pfeiltaste/Wischen zum Starten!</div>
            <div>🧬 Quiz alle 50 Punkte!</div>
        </div>
        
        <div id="gameOver" class="game-over" style="display: none;">
            Game Over! 💀
            <br>
            <button class="restart-btn" onclick="restartGame()">Neues Spiel</button>
        </div>

        <div id="quizModal" class="quiz-modal" style="display: none;">
            <div class="quiz-content">
                <h3>🧬 Immunsystem Quiz</h3>
                <p id="quizQuestion"></p>
                <div class="quiz-buttons">
                    <button class="quiz-btn" onclick="answerQuestion(true)">✓ Wahr</button>
                    <button class="quiz-btn" onclick="answerQuestion(false)">✗ Falsch</button>
                </div>
                <p id="quizExplanation" style="display: none;"></p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highscoreElement = document.getElementById('highscore');
        const gameOverElement = document.getElementById('gameOver');
        const pausedIndicator = document.getElementById('pausedIndicator');

        // Spielkonstanten
        const GRID_SIZE = 20;
        const GRID_WIDTH = canvas.width / GRID_SIZE;
        const GRID_HEIGHT = canvas.height / GRID_SIZE;

        // Spielzustand
        let snake = [{x: Math.floor(GRID_WIDTH/2), y: Math.floor(GRID_HEIGHT/2)}];
        let direction = {x: 0, y: 0};
        let food = {};
        let score = 0;
        let gameRunning = false;
        let isPaused = false;
        let isQuizMode = false;
        let highscore = parseInt(localStorage.getItem('snakeHighscore') || '0');
        let currentQuestion = null;

        // Touch-Steuerung Variablen
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const minSwipeDistance = 50; // Mindestdistanz für eine Wischgeste

        // Quiz-Fragen zum Immunsystem
        const quizQuestions = [
            {
                question: "Das humorale Immunsystem produziert Antikörper.",
                answer: true,
                explanation: "Richtig! B-Zellen produzieren Antikörper (humorale Immunität)."
            },
            {
                question: "T-Zellen gehören zur zellulären Immunantwort.",
                answer: true,
                explanation: "Richtig! T-Zellen sind die Hauptakteure der zellulären Immunität."
            },
            {
                question: "Antikörper können direkt infizierte Zellen zerstören.",
                answer: false,
                explanation: "Falsch! Antikörper markieren Eindringlinge, aber T-Zellen zerstören infizierte Zellen."
            },
            {
                question: "Das zelluläre Immunsystem bekämpft Viren in Zellen.",
                answer: true,
                explanation: "Richtig! Zytotoxische T-Zellen erkennen und zerstören virusinfizierte Zellen."
            },
            {
                question: "B-Zellen gehören zur zellulären Immunantwort.",
                answer: false,
                explanation: "Falsch! B-Zellen gehören zur humoralen Immunantwort (produzieren Antikörper)."
            },
            {
                question: "Antikörper können Bakterien neutralisieren.",
                answer: true,
                explanation: "Richtig! Antikörper binden an Bakterien und neutralisieren sie."
            },
            {
                question: "Killerzellen (NK-Zellen) gehören zur humoralen Immunität.",
                answer: false,
                explanation: "Falsch! NK-Zellen gehören zur zellulären Immunität."
            },
            {
                question: "Das humorale Immunsystem arbeitet mit löslichen Faktoren.",
                answer: true,
                explanation: "Richtig! Antikörper sind lösliche Faktoren im Blut und anderen Körperflüssigkeiten."
            },
            {
                question: "T-Helferzellen können direkt Krankheitserreger angreifen.",
                answer: false,
                explanation: "Falsch! T-Helferzellen koordinieren die Immunantwort, greifen aber nicht direkt an."
            },
            {
                question: "Plasma-Zellen sind aktivierte B-Zellen.",
                answer: true,
                explanation: "Richtig! Plasma-Zellen sind B-Zellen, die große Mengen Antikörper produzieren."
            },
            {
                question: "Zytotoxische T-Zellen gehören zur humoralen Immunität.",
                answer: false,
                explanation: "Falsch! Zytotoxische T-Zellen gehören zur zellulären Immunität."
            },
            {
                question: "Das humorale Immunsystem kann Toxine neutralisieren.",
                answer: true,
                explanation: "Richtig! Antikörper können Toxine binden und neutralisieren."
            },
            {
                question: "T-Gedächtniszellen gehören zur zellulären Immunantwort.",
                answer: true,
                explanation: "Richtig! T-Gedächtniszellen sind Teil der zellulären Immunität."
            },
            {
                question: "Immunglobuline sind Antikörper.",
                answer: true,
                explanation: "Richtig! Immunglobuline (IgG, IgM, IgA etc.) sind Antikörper der humoralen Immunität."
            },
            {
                question: "Makrophagen gehören zur humoralen Immunantwort.",
                answer: false,
                explanation: "Falsch! Makrophagen gehören zur zellulären Immunantwort."
            },
            {
                question: "Das Komplementsystem ist Teil der humoralen Immunität.",
                answer: true,
                explanation: "Richtig! Das Komplementsystem besteht aus löslichen Proteinen der humoralen Immunität."
            },
            {
                question: "Perforin wird von B-Zellen produziert.",
                answer: false,
                explanation: "Falsch! Perforin wird von zytotoxischen T-Zellen produziert (zelluläre Immunität)."
            },
            {
                question: "Antikörper können Viren außerhalb von Zellen neutralisieren.",
                answer: true,
                explanation: "Richtig! Antikörper können freie Viren neutralisieren, bevor sie Zellen infizieren."
            },
            {
                question: "Dendritische Zellen sind Teil der zellulären Immunantwort.",
                answer: true,
                explanation: "Richtig! Dendritische Zellen präsentieren Antigene und aktivieren T-Zellen."
            },
            {
                question: "IgE-Antikörper sind wichtig bei allergischen Reaktionen.",
                answer: true,
                explanation: "Richtig! IgE-Antikörper der humoralen Immunität vermitteln allergische Reaktionen."
            },
            {
                question: "CTL (Cytotoxic T Lymphocytes) produzieren Antikörper.",
                answer: false,
                explanation: "Falsch! CTL gehören zur zellulären Immunität und töten infizierte Zellen direkt."
            },
            {
                question: "Antikörper können Parasiten opsonisieren.",
                answer: true,
                explanation: "Richtig! Antikörper markieren Parasiten für die Zerstörung durch andere Immunzellen."
            },
            {
                question: "Granzyme werden von B-Zellen freigesetzt.",
                answer: false,
                explanation: "Falsch! Granzyme werden von zytotoxischen T-Zellen freigesetzt (zelluläre Immunität)."
            },
            {
                question: "B-Gedächtniszellen gehören zur humoralen Immunantwort.",
                answer: true,
                explanation: "Richtig! B-Gedächtniszellen sorgen für schnelle Antikörperproduktion bei Reinfektionen."
            },
            {
                question: "Das zelluläre Immunsystem kann Tumorzellen erkennen.",
                answer: true,
                explanation: "Richtig! Zytotoxische T-Zellen und NK-Zellen können veränderte Tumorzellen erkennen und zerstören."
            }
        ];

        // Highscore anzeigen
        highscoreElement.textContent = highscore;

        // Touch-Event-Handler
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function handleTouchMove(e) {
            e.preventDefault();
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            
            // Wenn im Quiz-Modus, ignoriere Touch-Events
            if (isQuizMode) {
                return;
            }
            
            const touch = e.changedTouches[0];
            touchEndX = touch.clientX;
            touchEndY = touch.clientY;
            
            handleSwipe();
        }

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            const absDeltaX = Math.abs(deltaX);
            const absDeltaY = Math.abs(deltaY);
            
            // Überprüfe, ob die Wischgeste lang genug ist
            if (Math.max(absDeltaX, absDeltaY) < minSwipeDistance) {
                // Kurzer Tap - Pause/Unpause
                if (gameRunning && !isQuizMode) {
                    isPaused = !isPaused;
                }
                return;
            }
            
            // Bestimme die Richtung der Wischgeste
            if (absDeltaX > absDeltaY) {
                // Horizontale Wischgeste
                if (deltaX > 0 && direction.x === 0) {
                    // Wisch nach rechts
                    direction = {x: 1, y: 0};
                    if (!gameRunning) {
                        gameRunning = true;
                        gameOverElement.style.display = 'none';
                    }
                } else if (deltaX < 0 && direction.x === 0) {
                    // Wisch nach links
                    direction = {x: -1, y: 0};
                    if (!gameRunning) {
                        gameRunning = true;
                        gameOverElement.style.display = 'none';
                    }
                }
            } else {
                // Vertikale Wischgeste
                if (deltaY > 0 && direction.y === 0) {
                    // Wisch nach unten
                    direction = {x: 0, y: 1};
                    if (!gameRunning) {
                        gameRunning = true;
                        gameOverElement.style.display = 'none';
                    }
                } else if (deltaY < 0 && direction.y === 0) {
                    // Wisch nach oben
                    direction = {x: 0, y: -1};
                    if (!gameRunning) {
                        gameRunning = true;
                        gameOverElement.style.display = 'none';
                    }
                }
            }
        }

        // Touch-Events für Canvas registrieren
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

        // Zufällige Essensposition
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * GRID_WIDTH),
                y: Math.floor(Math.random() * GRID_HEIGHT)
            };
            
            // Überprüfen, ob Essen auf der Schlange liegt
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        // Spielfeld zeichnen
        function draw() {
            // Hintergrund
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Schlange zeichnen
            ctx.fillStyle = '#4ecdc4';
            ctx.shadowColor = '#4ecdc4';
            ctx.shadowBlur = 10;
            
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                
                // Kopf der Schlange hervorheben
                if (i === 0) {
                    ctx.fillStyle = '#45b7aa';
                    ctx.shadowBlur = 15;
                } else {
                    ctx.fillStyle = '#4ecdc4';
                    ctx.shadowBlur = 8;
                }
                
                ctx.fillRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            }

            // Essen zeichnen
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            
            const foodX = food.x * GRID_SIZE;
            const foodY = food.y * GRID_SIZE;
            
            ctx.beginPath();
            ctx.arc(foodX + GRID_SIZE/2, foodY + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        // Spiellogik
        function update() {
            if (!gameRunning || isPaused || isQuizMode) return;

            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            // Kollision mit Wänden
            if (head.x < 0 || head.x >= GRID_WIDTH || head.y < 0 || head.y >= GRID_HEIGHT) {
                gameOver();
                return;
            }

            // Kollision mit sich selbst
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Essen konsumiert?
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                // Alle 50 Punkte eine Quiz-Frage stellen
                if (score > 0 && score % 50 === 0) {
                    showQuizQuestion();
                    return;
                }
                
                generateFood();
                
                // Highscore aktualisieren
                if (score > highscore) {
                    highscore = score;
                    highscoreElement.textContent = highscore;
                    localStorage.setItem('snakeHighscore', highscore.toString());
                }
            } else {
                snake.pop();
            }
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            isQuizMode = false;
            pausedIndicator.style.display = 'none';
            gameOverElement.style.display = 'block';
            
            // Schlange automatisch zurück in die Mitte setzen
            snake = [{x: Math.floor(GRID_WIDTH/2), y: Math.floor(GRID_HEIGHT/2)}];
            direction = {x: 0, y: 0};
        }

        // Spiel neu starten
        function restartGame() {
            snake = [{x: Math.floor(GRID_WIDTH/2), y: Math.floor(GRID_HEIGHT/2)}];
            direction = {x: 0, y: 0};
            score = 0;
            scoreElement.textContent = score;
            gameRunning = false;
            isPaused = false;
            isQuizMode = false;
            currentQuestion = null;
            gameOverElement.style.display = 'none';
            pausedIndicator.style.display = 'none';
            closeQuizModal();
            generateFood();
        }

        // Quiz-Funktionen
        function showQuizQuestion() {
            isQuizMode = true;
            pausedIndicator.style.display = 'block';
            
            // Zufällige Frage auswählen
            const randomIndex = Math.floor(Math.random() * quizQuestions.length);
            const question = quizQuestions[randomIndex];
            
            document.getElementById('quizQuestion').textContent = question.question;
            document.getElementById('quizExplanation').style.display = 'none';
            document.getElementById('quizModal').style.display = 'flex';
            
            // Aktuelle Frage für die Antwort-Funktion speichern
            currentQuestion = question;
            
            // Button-Styles zurücksetzen
            const buttons = document.querySelectorAll('.quiz-btn');
            buttons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = false;
            });
        }

        function answerQuestion(userAnswer) {
            const question = currentQuestion;
            const buttons = document.querySelectorAll('.quiz-btn');
            const explanation = document.getElementById('quizExplanation');
            
            // Buttons deaktivieren
            buttons.forEach(btn => btn.disabled = true);
            
            if (userAnswer === question.answer) {
                // Richtige Antwort
                buttons[userAnswer ? 0 : 1].classList.add('correct');
                explanation.textContent = question.explanation;
                explanation.style.display = 'block';
                explanation.style.color = '#4CAF50';
                
                setTimeout(() => {
                    closeQuizModal();
                    continueGame();
                }, 2000);
            } else {
                // Falsche Antwort
                buttons[userAnswer ? 0 : 1].classList.add('wrong');
                buttons[question.answer ? 0 : 1].classList.add('correct');
                explanation.textContent = question.explanation;
                explanation.style.display = 'block';
                explanation.style.color = '#f44336';
                
                setTimeout(() => {
                    closeQuizModal();
                    gameOver();
                }, 3000);
            }
        }

        function closeQuizModal() {
            document.getElementById('quizModal').style.display = 'none';
            isQuizMode = false;
            pausedIndicator.style.display = 'none';
        }

        function continueGame() {
            generateFood();
            
            // Highscore aktualisieren
            if (score > highscore) {
                highscore = score;
                highscoreElement.textContent = highscore;
                localStorage.setItem('snakeHighscore', highscore.toString());
            }
        }

        // Tastatureingabe
        document.addEventListener('keydown', (e) => {
            // Pfeiltasten im Quiz-Modus ignorieren
            if (isQuizMode) {
                return;
            }
            
            switch(e.code) {
                case 'ArrowUp':
                    if (direction.y === 0) {
                        direction = {x: 0, y: -1};
                        if (!gameRunning) {
                            gameRunning = true;
                            gameOverElement.style.display = 'none';
                        }
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) {
                        direction = {x: 0, y: 1};
                        if (!gameRunning) {
                            gameRunning = true;
                            gameOverElement.style.display = 'none';
                        }
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) {
                        direction = {x: -1, y: 0};
                        if (!gameRunning) {
                            gameRunning = true;
                            gameOverElement.style.display = 'none';
                        }
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) {
                        direction = {x: 1, y: 0};
                        if (!gameRunning) {
                            gameRunning = true;
                            gameOverElement.style.display = 'none';
                        }
                    }
                    break;
                case 'Space':
                    if (gameRunning && !isQuizMode) {
                        isPaused = !isPaused;
                    }
                    break;
            }
        });

        // Spiel-Loop (nur für Zeichnen)
        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Spiel initialisieren
        generateFood();
        gameLoop();
        
        // Spiel-Geschwindigkeit
        setInterval(() => {
            if (gameRunning && !isPaused && !isQuizMode) {
                update();
            }
        }, 150);
    </script>
</body>
</html>
